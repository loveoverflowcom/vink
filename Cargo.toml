[workspace]
resolver = "3"
members = ["apps/vink-web", "services/vink-app", "xtask"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
leptos = "0.8.22"
leptos_meta = "0.8.7"
leptos_router = "0.8.17"
leptos_axum = "0.8.10"
axum = "0.8.9"
tokio = "1.54.1"
tower = "0.5.3"
tower-http = "0.6.11"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "macros", "migrate", "uuid", "time", "json"] }
uuid = "1.29.0"
time = "0.3.55"
thiserror = "2.0.21"
# Browser build: the wasm-bindgen crate must equal the wasm-bindgen CLI version
# (`cargo xtask doctor` checks both). Bump them together.
wasm-bindgen = "=0.2.129"

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
