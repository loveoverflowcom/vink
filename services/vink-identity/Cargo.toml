[package]
name = "vink-identity"
version = "0.1.0"
description = "Vink Identity: private authentication-facts service with its own database, migrations and contract"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
vink-store-postgres = { path = "../../packages/store-postgres" }
axum.workspace = true
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "net", "time", "fs"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "json", "fmt"] }
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
time = { workspace = true, features = ["serde", "formatting", "parsing", "macros"] }
tower = { workspace = true, features = ["util"] }

[dev-dependencies]
futures-util = "0.3.34"
