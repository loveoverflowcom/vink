[package]
name = "vink-identity"
version = "0.1.0"
description = "Vink Identity: private authentication-facts service with its own database, migrations and contract"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
vink-store-postgres = { path = "../../packages/store-postgres" }
axum.workspace = true
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "net", "time", "fs"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "json", "fmt"] }
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
time = { workspace = true, features = ["serde", "formatting", "parsing", "macros"] }
tower = { workspace = true, features = ["util"] }
uuid = { workspace = true, features = ["v7"] }
base64 = "0.22.1"
getrandom = "0.3.4"
# SMTP submission (D-05 production mail path): rustls/ring + webpki roots like sqlx; no
# connection pool, so each delivery opens a fresh, authenticated connection.
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "builder"] }
sha2 = "0.11.1"
subtle = "2.6.1"
unicode-normalization = "0.1.26"

[dev-dependencies]
futures-util = "0.3.34"
