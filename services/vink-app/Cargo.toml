[package]
name = "vink-app"
version = "0.1.0"
description = "Vink composition root: domain, application, PostgreSQL/HTTP adapters, SSR host and worker"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
default-run = "vink-app"

[lints]
workspace = true

[dependencies]
vink-web = { path = "../../apps/vink-web", features = ["ssr"] }
vink-store-postgres = { path = "../../packages/store-postgres" }
leptos = { workspace = true, features = ["ssr"] }
leptos_meta = { workspace = true, features = ["ssr"] }
leptos_axum.workspace = true
axum.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "net", "time"] }
tower.workspace = true
tower-http = { workspace = true, features = ["fs", "trace", "set-header"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "json", "fmt"] }
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
uuid = { workspace = true, features = ["v4", "v7", "serde"] }
time = { workspace = true, features = ["serde", "formatting", "parsing", "macros"] }
thiserror.workspace = true
hyper = { version = "1.12.0", features = ["http1", "client"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1.5"
sha2 = "0.11.1"
hmac = "0.13.0"
unicode-segmentation = "1.13.3"
form_urlencoded = "1.2.2"
unicode-normalization = "0.1.26"
# Markdown title authority (#263): CommonMark AST, no HTML renderer or CLI features.
vink-markdown-text = { path = "../../packages/markdown-text" }

[dev-dependencies]
leptos_router.workspace = true
tower = { workspace = true, features = ["util"] }
