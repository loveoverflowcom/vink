[package]
name = "vink-app"
version = "0.1.0"
description = "Vink composition root: domain, application, PostgreSQL/HTTP adapters, SSR host and worker"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
default-run = "vink-app"

[dependencies]
vink-web = { path = "../../apps/vink-web", features = ["ssr"] }
leptos = { workspace = true, features = ["ssr"] }
leptos_meta = { workspace = true, features = ["ssr"] }
leptos_axum.workspace = true
axum.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "net", "time"] }
tower.workspace = true
tower-http = { workspace = true, features = ["fs", "trace", "set-header"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "json", "fmt"] }
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
uuid = { workspace = true, features = ["v7", "serde"] }
time = { workspace = true, features = ["serde", "formatting", "parsing", "macros"] }
thiserror.workspace = true
sha2 = "0.11.1"
unicode-normalization = "0.1.26"

[dev-dependencies]
http-body-util = "0.1.3"
tower = { workspace = true, features = ["util"] }
