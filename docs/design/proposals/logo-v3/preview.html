<!doctype html><html lang="vi"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vink SVG v3</title><style>body{font:16px system-ui;margin:0;background:#fffaff;color:#2c193d}body.dark{background:#17121d;color:#f5eaf9}main{max-width:900px;margin:auto;padding:40px}button{border:0;border-radius:100px;padding:12px 16px;background:#d8bdf1;color:#2a1942;cursor:pointer}header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}.panels{display:flex;gap:22px;align-items:center;flex-wrap:wrap;margin:36px 0}.panels img{width:200px}.word{font:bold 72px Georgia,serif}.samples{display:flex;gap:20px;align-items:end;flex-wrap:wrap}figure{margin:0;text-align:center}figcaption{font-size:12px;margin:12px 0}</style><main><header><div><h1>Vink · Logo v3</h1><p>Light / Dark — hình học không đổi, SVG thực.</p></div><button id="toggle">Đổi theme</button></header><div class="panels"><img id="mark" src="vink-mark-light.svg" alt="Vink logo"/><span class="word">Vink</span></div><h2>So sánh kích thước</h2><div id="samples" class="samples"></div><p>Bản compact được sử dụng ở 16, 24, 32 px.</p></main><script>let mode=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';for(const n of [16,24,32,48,96,192]){const f=document.createElement('figure');f.innerHTML='<img data-size="'+n+'" width="'+n+'" height="'+n+'"><figcaption>'+n+'px</figcaption>';document.getElementById('samples').append(f)}function draw(){document.body.className=mode==='dark'?'dark':'';document.getElementById('mark').src='vink-mark-'+mode+'.svg';document.querySelectorAll('[data-size]').forEach(x=>x.src='vink-mark-'+mode+(Number(x.dataset.size)<=32?'-compact':'')+'.svg')}document.getElementById('toggle').onclick=()=>{mode=mode==='light'?'dark':'light';draw()};draw()</script></html>
