# CI prepares tools and services, then calls the same `cargo xtask verify <lane>` used locally.
# Lanes and their scope: docs/development/README.md. Actions are pinned by commit.
name: CI

on:
  push:
    branches: [develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quick:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: cargo xtask verify quick

  discussion:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: cargo xtask verify discussion

  expressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: cargo xtask verify expressions

  kani:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # xtask never installs verifiers. Same pin as xtask/src/kani.rs; `setup` fetches the
      # matching release bundle and its nightly compiler.
      - name: Install the pinned Kani verifier
        run: cargo install --locked kani-verifier --version 0.67.0 && cargo kani setup
      - run: cargo xtask verify kani

  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: vink
          POSTGRES_PASSWORD: vink-ci-only
          POSTGRES_DB: vink
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vink -d vink"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      # Test harness credential: the service container's superuser creates scratch databases
      # and roles; the lane provisions separate migrator/runtime roles for the binaries.
      VINK_TEST_DATABASE_URL: postgres://vink:vink-ci-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Provisioning needs psql 15+ (\getenv); backup/restore needs client 17 or newer.
      # Configure PGDG explicitly: the runner's Ubuntu sources may not provide client 17.
      # https://www.postgresql.org/download/linux/ubuntu/
      - name: Install the PostgreSQL 17 client tools
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --retry 3 -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-17
      - run: psql --version && /usr/lib/postgresql/17/bin/pg_dump --version
      - run: cargo xtask verify postgres
        env:
          VINK_PG_BIN: /usr/lib/postgresql/17/bin

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: vink
          POSTGRES_PASSWORD: vink-ci-only
          POSTGRES_DB: vink
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vink -d vink"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      VINK_TEST_DATABASE_URL: postgres://vink:vink-ci-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Must equal the wasm-bindgen version in Cargo.lock; `cargo xtask doctor` fails otherwise.
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: wasm-bindgen-cli@0.2.129
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Google Chrome is preinstalled on GitHub's ubuntu-24.04 image.
      - run: cargo xtask verify web
      - run: cargo xtask ui-preview leptos verify
        env:
          VINK_UI_FOCUS_CAPTURE: "1"
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-evidence
          path: |
            target/verify-web/
            target/ui-preview/leptos/captures/
          retention-days: 14

  ui-cmp-macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Verify CMP fonts and renderer on macOS as well as Linux
        run: |
          export JAVA_HOME="$(/usr/libexec/java_home -v 17)"
          cargo xtask ui-preview cmp verify
      - name: Preserve macOS CMP evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-cmp-macos-evidence
          path: |
            packages/ui-system/cmp/preview/build/captures/
            packages/ui-system/cmp/preview/build/test-results/
            packages/ui-system/cmp/diagnostics/build/test-results/
          retention-days: 14

  ui-cmp:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Prepare JVM renderer libraries
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libgl1 libfontconfig1 libxrender1 libxi6 libxtst6
      - name: Verify actual CMP desktop renderer (no native SDK required)
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          cargo xtask ui-preview cmp verify
      - name: Preserve CMP evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-cmp-evidence
          path: |
            packages/ui-system/cmp/preview/build/captures/
            packages/ui-system/cmp/preview/build/test-results/
            packages/ui-system/cmp/diagnostics/build/test-results/
          retention-days: 14
