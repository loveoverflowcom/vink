[package]
name = "vink-web"
version = "0.1.0"
description = "Vink Leptos views, routes and the browser's own API representations"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos.workspace = true
leptos_meta.workspace = true
leptos_router.workspace = true
serde.workspace = true
unicode-normalization = "0.1.26"
# Server-only: response status for SSR pages. Never part of the browser build.
leptos_axum = { workspace = true, optional = true }
# Browser-only.
wasm-bindgen = { workspace = true, optional = true }
console_error_panic_hook = { version = "0.1.7", optional = true }
gloo-net = { version = "0.7.0", optional = true, default-features = false, features = ["http", "json"] }
web-sys = { version = "0.3.106", optional = true, features = [
    "Window", "Location", "Document", "Element", "HtmlElement", "HtmlAnchorElement",
    "HtmlDialogElement", "HtmlInputElement", "BeforeUnloadEvent", "Event", "EventTarget",
    "MouseEvent", "KeyboardEvent", "AddEventListenerOptions", "History", "Url", "Blob",
    "BlobPropertyBag", "FocusOptions", "Storage", "DomRect", "CssStyleDeclaration",
    "ResizeObserver", "NodeList",
] }
js-sys = { version = "0.3.106", optional = true }
wasm-bindgen-futures = { version = "0.4.79", optional = true }
send_wrapper = { version = "0.6.0", optional = true, features = ["futures"] }
# Server-only: HTTP status codes for SSR pages.
http = { version = "1.4.0", optional = true }

[dev-dependencies]
serde_json.workspace = true

[features]
hydrate = ["leptos/hydrate", "dep:wasm-bindgen", "dep:console_error_panic_hook", "dep:gloo-net", "dep:web-sys", "dep:js-sys", "dep:wasm-bindgen-futures", "dep:send_wrapper"]
ssr = ["leptos/ssr", "leptos_meta/ssr", "leptos_router/ssr", "dep:leptos_axum", "dep:http"]
