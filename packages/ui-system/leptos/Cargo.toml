[package]
name = "vink-ui"
version = "0.1.0"
description = "Vink UI system: Leptos renderer of the shared token contract (tokens, scopes and primitive components)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Renders facts and dispatches intents only: no storage, routes, session, API or service crates.
# Features come from the consumer (`ssr` / `hydrate` / `csr` on leptos); this crate adds none.
[dependencies]
leptos.workspace = true
# NFC and combining-mark classes for avatar initials (avatar-identity-v1).
unicode-normalization = "0.1.26"

# Browser-only adapters (Page Visibility, performance clock) of the UIS-03 feedback components.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3.106", features = ["CssStyleDeclaration", "Document", "FocusOptions", "DomRect", "Element", "HtmlElement", "Performance", "ResizeObserver", "VisibilityState", "Window"] }

[dev-dependencies]
# String rendering in tests only.
leptos = { workspace = true, features = ["ssr"] }
