[package]
name = "vink-ui-preview"
version = "0.1.0"
description = "Isolated Leptos preview of the Vink UI system (catalog, controls, inspector); calls no service"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# Depends on the renderer's public API only. Without `csr` the crate compiles (and tests) on the
# host so workspace clippy/test cover it; `cargo xtask ui-preview leptos build` enables `csr`.
[dependencies]
vink-patterns = { path = "../../../vink-patterns/leptos" }
leptos.workspace = true
vink-ui = { path = ".." }
unicode-normalization = "0.1.26"
wasm-bindgen = { workspace = true, optional = true }
console_error_panic_hook = { version = "0.1.7", optional = true }
web-sys = { version = "0.3.106", optional = true, features = [
    "Window", "Location", "Document", "Element", "CssStyleDeclaration", "HashChangeEvent",
    "MediaQueryList", "EventTarget", "ResizeObserver",
] }

[dev-dependencies]
leptos = { workspace = true, features = ["ssr"] }

[features]
csr = ["leptos/csr", "dep:wasm-bindgen", "dep:console_error_panic_hook", "dep:web-sys"]
