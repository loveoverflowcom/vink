# Isolated compiler compatibility surface: exactly the production library, no copied reducer.
[package]
name = "vink-expressions-proof"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false

[lib]
path = "../src/lib.rs"

[workspace]

# Repeats the workspace lints: this manifest compiles production sources outside the workspace.
[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
