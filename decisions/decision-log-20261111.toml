revision = 1

[records.content]
kind = "architecture"
domain = "endorsement"
title = "#73 CHOICE-10, lát Web adapter WP-04"
resolution = "**A** — không optimistic: bấm chỉ đặt `Pending` (ghi chú “Đang gửi…”, MicroArc); giá trị và số đếm chỉ đổi theo ACK `accepted`/`replayed` (trạng thái hiện tại `endorsement`, không phải `committed`) hoặc đọc lại own state; mất phản hồi/timeout/`503`/`500` → `Uncertain` chặn bấm, “Kiểm tra lại” replay đúng lệnh (cùng key, order, trạng thái mong muốn, revision); own state chưa đọc/đọc lỗi → `Unknown`, “Kiểm tra lại” đọc lại"
rationale = "B (optimistic có nhãn) cần phase mới + `toggle-contract-v2`, rollback hiển thị và fence ý định mới nhất xuyên thiết bị mà lõi không hứa; lợi ích là độ trễ cảm nhận của một nút nhỏ, không đáng rủi ro “đã ghi nhận” giả. Đánh giá lại nếu đo được độ trễ ghi thật làm người đọc bấm lặp"

