[content]
kind = "architecture"
domain = "reputation"
title = "Hướng backend Reputation V1 và các lựa chọn kỹ thuật mở"
resolution = """
Hướng đề xuất, chưa ACCEPTED: Rust Domain sở hữu policy/formula, PostgreSQL sở hữu nguồn và projection bền vững, worker xử lý batch bất đồng bộ, API chỉ đọc projection có guard visibility. Không bắt buộc thêm service, Redis, Kafka. Tách current score và period growth; giữ version formula, eligibility, projection độc lập. Chỉ accepted business transitions có effect; idempotency theo event và business key, lifecycle/reversal, reconciliation, rebuild và coherent cutover. Không dùng notification stream/retention thay nguồn authority. Privacy fail closed kể cả projection đang lag; đọc score/indexed top-k bounded, không aggregate toàn cục tại request.
Các lựa chọn OPEN_TECHNICAL: audit outbox/dirty queue, ledger/entitlement, snapshot watermark và event-time kỳ, semantic reversal cho growth, storage/retention và privacy invalidation, index/top-k/cursor/freshness, backfill và version cutover. Owner quyết với benchmark và bằng chứng source/PG/HTTP; không hardcode candidate công thức hoặc chốt quy tắc sản phẩm mở.
Phân rã đề xuất 6 PR: Shape/Research/SSOT; Pure Domain; DB/Sources; Worker/Recovery; Statistics/Period Aggregation; API/Qualification. Chưa tạo issue con; design/Web độc lập.
"""
rationale = "Epic #600 và delta hai lượt review 27/11/2026. Hướng ban đầu tránh ảnh hưởng nghiệp vụ và không suy signoff kiến trúc từ quyết định sản phẩm; cần đo thực tế."
requires = [
