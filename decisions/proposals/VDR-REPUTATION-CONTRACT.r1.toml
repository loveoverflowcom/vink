[content]
kind = "architecture"
domain = "reputation"
title = "Hướng backend Reputation V1 và các lựa chọn kỹ thuật mở"
resolution = """
Hướng đề xuất, chưa ACCEPTED: Rust Domain sở hữu policy/formula, PostgreSQL sở hữu nguồn và projection bền vững, worker xử lý batch bất đồng bộ, API chỉ đọc projection có guard visibility. Không bắt buộc thêm service, Redis, Kafka. Tách current score và period growth, hỗ trợ kỳ hiện tại/kỳ đã kết thúc với rating as-of end boundary, không dùng peak/current thay historical rating; signed growth gồm thu hồi tương tác cũ trong kỳ và bù re-like cùng kỳ, không credit re-like khác kỳ; tuần/tháng projection độc lập, không đồng nhất lifecycle restore với đóng góp mới; đình chỉ toàn bộ là public visibility gate (không xóa facts hợp lệ); giữ version formula, eligibility, projection độc lập. Chỉ accepted business transitions có effect; idempotency theo event và business key, lifecycle/reversal, reconciliation, rebuild và coherent cutover. Không dùng notification stream/retention thay nguồn authority. Privacy fail closed kể cả projection đang lag; đọc score/indexed top-k bounded, không aggregate toàn cục tại request.
Các lựa chọn OPEN_TECHNICAL: audit outbox/dirty queue, ledger/entitlement, snapshot watermark/event-time kỳ và as-of rating reconstruction (bao gồm tác giả không biến động trong kỳ), semantic reversal cho growth, storage/retention, closed-period correction và privacy invalidation hiện hành (cả historical projections), index/top-k/cursor/freshness, backfill và version cutover. Owner quyết với benchmark và bằng chứng source/PG/HTTP; không hardcode candidate công thức hoặc chốt quy tắc sản phẩm mở.
Phân rã đề xuất 6 PR: Shape/Research/SSOT; Pure Domain; DB/Sources; Worker/Recovery; Statistics/Period Aggregation; API/Qualification. Chưa tạo issue con; design/Web độc lập.
"""
rationale = "Epic #600 và delta bốn lượt review 27/11/2026. Hướng ban đầu tránh ảnh hưởng nghiệp vụ và không suy signoff kiến trúc từ quyết định sản phẩm; cần đo thực tế."
