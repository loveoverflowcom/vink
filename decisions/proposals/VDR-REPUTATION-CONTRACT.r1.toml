title = "Hướng backend Reputation V1 và các lựa chọn kỹ thuật mở"
resolution = """
Hướng backend chưa ACCEPTED; product authority VDR-REPUTATION@r1 Q01..44. Rust domain owns policy/formula; PostgreSQL accepted source effects in same transaction, durable event+business fencing; worker batch, PK current projection, snapshot reads; no new service/Redis/Kafka, no Notifications authority (activation/coverage khác), no Follow producer. No network in source tx, no source rank/ACL changes.
Q41 two independent credit states, burn fence, neutral lifecycle/correction separate. Q42 bounded maturity at authoritative threshold, current-only. Q32 receipt transitions/provenance; Q33 first full calendar periods and baseline burn. Q38 authorized operator CLI evidence/dry-run/audit/idempotent invalidation and full-population corrected as-of rebuild. Q43 distinct net-positive actor gate, no raw disclosure.
## Q44 — snapshot (chọn có điều kiện correctness)
Open top-k immutable snapshot generation/as_of, target 5–10 phút đo thực tế (không SLA); profile PK projection gần realtime. Closed top100+50 reserve/table/period, không dense member history; retain minimized ledger/checkpoint đủ exact as-of reconstruction toàn eligible population (kể cả member không biến động). Reserve chỉ optimization, không guarantee: >50 excluded, restore/outsider/correction đổi ordering hoặc thiếu candidates -> offline refill/rebuild từ toàn population, không false-complete/stale/unsafe. Nếu thiếu evidence mark incomplete/unavailable. Current privacy/standing/deletion gate trước limit/cursor, invalidate/withhold unsafe snapshot/cache ngay; cursor bound snapshot/version/visibility generation, reject/restart stale. Closed ordinary later score không đổi as-of-end; authoritative late/correction có version. Q15 retain 52 closed weeks/12 closed months + open; source/fence/audit retention tách, minimize/purge.
Retention Q15 separate minimized ledger/checkpoints/fences; prove exact reconstruction including members unchanged during period, no unsafe history. Privacy fail closed; snapshot/visibility version cursor, indexed bounded reads. Open technical: source ordering/coverage, schema, precision calibration, retention/minimization, maturity race, correction/late event semantics, snapshot cadence/refill/lag and performance, routes/DTO/runbook. No public activation before exact signoff and evidence. S01 #601 then S02 Domain, S03 DB/Sources, S04 Worker/Maturity/CLI, S05 Period Statistics, S06 API/Qualification, sequential.
"""
rationale = "Epic #600, final review 28/11/2026 Q01..44. Product direction recorded, exact architecture payload signoff and local qualification pending."
