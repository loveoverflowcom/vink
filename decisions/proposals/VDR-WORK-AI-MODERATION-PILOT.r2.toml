[content]
kind = "architecture"
domain = "moderation"
title = "Pilot AI kiểm duyệt tác phẩm song song trên môi trường cô lập bằng bài gửi thật"
resolution = """
Chọn phương án B (chạy song song/bóng tách biệt hoàn toàn khỏi quyết định xuất bản chính thức) cho pilot AI kiểm duyệt tác phẩm trên cặp App + PostgreSQL cô lập sử dụng các bản gửi thật đã bấm gửi duyệt công khai (request-public):

1. Tách luồng chính thức và luồng đối chiếu pilot: luồng kiểm duyệt chính thức giữ nguyên quy tắc hiện hành (người duyệt mở và kết thúc ca trên moderation_cases, viết work_revision_moderation/publications/work_appeals). Runner pilot discovery riêng đọc receipt request_public đã commit trong phạm vi đợt được cấp quyền, kiểm intent/revision/generation hiện hành rồi ghi idempotent vào work_ai_pilot_jobs; không thêm pilot vào transaction chính. Bảng pilot khóa/lỗi không được rollback hoặc chặn ca chính thức. Preflight xác minh automation chính paused và mock tắt, hoặc chứng minh fast-reroute đang chạy không mock. Runner/kết quả riêng không ghi bảng quyết định chính thức hay phát hành bài.
2. UI người duyệt chạy mù (blind): màn hình ca kiểm duyệt không hiển thị kết quả AI pilot trước khi người duyệt kết luận để giữ độc lập ground truth. Nếu người duyệt kết thúc trước, kết quả AI đến sau chỉ ghi dấu human_concluded_first = true để đối soát.
3. Dữ liệu và bất biến an toàn: working_drafts và autosave (save_draft / capture_snapshot) không bao giờ tạo job AI (MOD-05, INV-08). Chỉ revision có yêu cầu công khai đang active từ request-public mới hợp lệ; pre-flight và pre-record kiểm tra lại intent, audience='public', lifecycle='active' và set-private (rút về riêng tư) để hủy/loại bỏ kết quả. Payload chỉ thêm policy_version, title_nfc và body_blocks_nfc, không join metadata định danh, bản nháp, ghi chú/lịch sử/phản đối. Văn bản tự do vẫn có thể có PII; bỏ metadata không phải ẩn danh và request_public không tự cấp quyền gửi ngoài. Chỉ egress khi căn cứ dùng nội dung cho vendor cụ thể đã được xác minh. Log không chứa văn bản, tên field từ model hay lỗi parser phản chiếu.
4. Kiểm soát lỗi và dừng khẩn: giữ hợp đồng RawEvaluatorOutput đóng kín (deny_unknown_fields), tắt tools/grounding, lease_duration và lease còn lại trước dispatch phải >= request_timeout + 15000 ms với cộng có kiểm tràn. Tối đa 3 claim tính cả crash/hết lease; generation fence và result/terminal state commit atomically. Timeout/abort không bảo đảm provider chưa nhận, pause không thu hồi dữ liệu đã gửi; không hứa exactly-once HTTP. Circuit-breaker cho lỗi xác thực/cấu hình, công tắc dừng độc lập MOD-14. Egress thật dùng production profile với guards đầy đủ nhưng trên target/DB cô lập; profile không tự cấp quyền deploy.
5. Bảo lưu phạm vi: không thay đổi MOD-06 (ngưỡng tự động công khai), MOD-09/MOD-14, không áp dụng cho bình luận, và không mặc định cho phép gửi bài ra provider ngoài nếu chưa qua kiểm tra tiền điều kiện.

Các điểm mở sản phẩm (open_product) cần chủ sản phẩm xác nhận trước khi bật gọi provider mạng thật:
- Chọn vendor/gói thương mại (Google Vertex AI / Gemini Paid vs OpenAI API vs Anthropic API vs self-hosted) và xác nhận có yêu cầu Zero Data Retention (ZDR) cứng trước khi chạy hay chấp nhận gói trả phí No-Training + tắt cache/grounding với hạn lưu mục tiêu <= 30 ngày được xác minh cho đúng model/gói/tài khoản, kể cả ngoại lệ. Paid, store=false hay ZDR cấp org không tự chứng minh mọi model/feature đáp ứng; nếu chưa đủ bằng chứng thì egress giữ tắt.
- Chốt thời hạn lưu và xóa/hủy DB pilot sau khi hoàn tất báo cáo đối chiếu (đề xuất <= 30 ngày sau nghiệm thu báo cáo).
- Chốt việc giữ nguyên payload không kèm tags/metadata trong pilot giai đoạn 1 hay cho phép gửi kèm tag thể loại/chủ đề đã duyệt ở giai đoạn tiếp theo.
"""
rationale = """
Đối chiếu mã nguồn tại develop@4ff33bf4 cho thấy EvaluationWorker hiện trả None nếu tắt mock, khiến finish_job chuyển ngay job sang rerouted và mở ca người duyệt. Nếu gán trực tiếp luồng gọi AI vào trong EvaluationWorker::pass (phương án A), độ trễ mạng/timeout/retry tới 3 lần sẽ làm trễ mở moderation_cases (với lease_duration = 30s hiện tại), dễ đụng timeout thuê bao khi gọi AI, và buộc cơ chế automation pause (MOD-14) kiêm vai trò công tắc tắt pilot. Tách runner pilot sang phương án B bảo toàn tuyệt đối MOD-05, MOD-06, MOD-09, MOD-14, PUB-06, INV-08, giúp dừng pilot hoặc mất kết nối không ảnh hưởng hàng đợi người duyệt và thu thập được ma trận đối chiếu mù trên 5 nhóm văn học tiếng Việt (thơ, phương ngữ, lời thoại, trào phúng, bài mơ hồ). Lượt review PR #187 trên develop@7d26c71 bổ sung rào chắn queue, dữ liệu, lease và provider retention, không chốt các lựa chọn sản phẩm. Proposal này mang trạng thái PENDING; signoff kiến trúc không tự giải quyết các câu hỏi OPEN, phải có revision/record chứa lựa chọn cụ thể với nguồn owner.
"""
