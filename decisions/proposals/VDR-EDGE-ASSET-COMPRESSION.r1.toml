version = 1
id = "VDR-EDGE-ASSET-COMPRESSION"
revision = 1

[content]
kind = "architecture"
domain = "platform"
title = "Nén asset phiên bản của Web production qua zone Cloudflare"
resolution = "CHOICE-01 A (#487): Worker production trả asset /_v/<sha>/pkg/ với Cache-Control public, max-age=31536000, immutable. Với text/javascript, text/css, application/wasm, image/svg+xml, application/manifest+json, application/json và text/plain, Worker bỏ no-transform và thêm Vary: Accept-Encoding để zone Cloudflare nén Brotli hoặc gzip theo Accept-Encoding của trình duyệt. Worker không tự nén và không chuyển header của client sang Pages, nên một byte inventory phục vụ mọi biến thể; ETag vẫn là SHA-256 của byte inventory, edge đổi thành W/ khi nén, Worker so If-None-Match theo phép so yếu. Font và ảnh giữ no-transform. READ-01 giữ private, no-cache, no-transform. smoke-edge.sh edge --release kiểm identity/gzip/br, Cache-Control, Vary, ETag bằng SHA-256 byte giải nén và 304. Không chọn B (tiền nén Brotli q11 và gzip lúc build, Worker chọn biến thể và giữ no-transform) trong lát này; B nằm trong #491 cùng hash theo từng file."
rationale = "Live e9872556 ngày 24/11/2026 (#473, PR #481): cold và lần đầu sau phát hành tải 8,72 MB không nén. Kiểm riêng cùng nhánh Worker inventory/r26: alias /pkg/ không có no-transform được nén br/gzip (WASM 7.872.530 → 2.164.334 byte br, ETag W/, 304 với cả ETag mạnh và W/), /_v/<sha>/ có no-transform luôn identity; vậy no-transform là nguyên nhân, còn việc không gửi Accept-Encoding tới Pages không ảnh hưởng. Replay lab cùng corpus 17 asset, Worker chạy trong workerd, zone stand-in hiệu chỉnh theo Cloudflare (Brotli q4, cửa sổ 128 KiB), 10 Mbps/60 ms, n=5: hydrated cold 7.292 → 2.488 ms (CPU 1×) và 7.556 → 2.741 ms (CPU 4×); lần đầu sau phát hành 7.332 → 2.451 ms và 7.546 → 2.691 ms; byte 8,71 → 2,64 MB; reload và mở lại không đổi (100% từ cache). B đo được 2.099 / 2.281 ms với 2,05 MB, chỉ hơn A khoảng 0,4 s nhưng phải đổi image/packager, inventory và smoke của controller. A đạt mục tiêu TTI cold 2–3 giây, chỉ đổi header ở một owner, không thêm file, bước build hay dịch vụ. Đánh đổi: mức nén do Cloudflare quyết định và ETag ở edge thành weak. Proposal PENDING cho tới khi chủ sản phẩm signoff đúng revision/SHA-256; chưa deploy production."
