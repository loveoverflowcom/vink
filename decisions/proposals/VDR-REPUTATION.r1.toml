28/11/2026: “Review lần cuối rồi tự đề xuất, tôi chấp nhận đề xuất bạn.” và “Log vào issue cũ hoặc mới và Pr đang có”. Q19..Q44 là đề xuất cuối được ghi tại #600 và #601.
