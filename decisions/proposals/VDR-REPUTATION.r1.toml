title = "Điểm Vink V1 — hai thành phần, uy tín hiện hành và thống kê theo kỳ"
resolution = """
Phạm vi nghiệp vụ #600, review 27–28/11/2026 (REP-Q01..44, product direction, exact signoff pending):
- REP-Q01 = A: Impact từ Thấm nhận được trên tác phẩm; Contribution từ Ưng nhận được trên nhận xét. Không tính Follow. Một tổng điểm kiểu rating, không phải Elo đối đầu; công khai điểm tổng, chưa công khai thành phần.
- REP-Q02 = A: ghi nhận Impact theo WorkId, cùng người Thấm nhiều revision chỉ tính một đơn vị hợp lệ; không sửa semantics endorsement neo RevisionId. Sửa thông thường không tự làm mất uy tín đã ghi nhận hợp lệ.
- REP-Q03 = B: current eligible rating, lifecycle neutral growth, Q19/Q20/Q21/Q38/Q41 apply; no V1 decay.
- REP-Q04 = A: tuần lịch thứ Hai–Chủ nhật và tháng lịch theo Asia/Ho_Chi_Minh; không phải rolling 7/30 ngày.
- REP-Q05 = B: net community growth credit according to Q41, fixed-unit Q28, not rating delta; neutral events separate.
- REP-Q06 = A: tổng điểm và thống kê tác giả uy tín cao/tăng nhanh theo tuần, tháng được công khai kể cả khách, chỉ đối với dữ liệu và hồ sơ đủ điều kiện; không lộ thành phần, private data hay cache cũ. Không mở quyền hoặc can thiệp ranking tác phẩm.
- REP-Q07 = A refined Q36/Q41: only withdraw unburned active community credit; never debit baseline/maturity/burned or repeat after boundary.
- REP-Q08 = A: đình chỉ toàn bộ tài khoản nhận điểm thì ẩn điểm công khai và loại khỏi mọi thống kê công khai trong thời gian đình chỉ, kể cả kỳ cũ. Giữ facts còn hợp lệ và đánh giá lại eligibility khi hết đình chỉ; không reset điểm hoặc tạo growth từ phục hồi standing. Hạn chế riêng đăng/bình luận không đồng nhất với đình chỉ toàn bộ; tương tác hợp lệ trước đình chỉ của actor theo Q14.
- REP-Q09 = A: current/retained closed statistics Q15; no preactivation history; Q33/Q44 coverage/snapshots/current privacy.
- REP-Q10 = A: open rating at current snapshot as_of, closed rating as-of end, not peak/current substitution; authoritative correction and privacy Q38/Q44.
- REP-Q11 = A: người chỉ đóng góp nhận xét vẫn có điểm và được tham gia thống kê nếu đủ eligibility; không bắt buộc có tác phẩm công khai. Điều kiện vào bảng theo Q17; eligibility của tương tác theo Q16.
- REP-Q12 = A refined Q41: same-period compensation, different-period burned credit cannot be granted or withdrawn again; week/month independent; neutral/correction separate.
- REP-Q13 = A: lifecycle remove changes current, neutral community growth, restoration no new credit; privacy/deletion/correction can restate historical.
- REP-Q14 = A: suspension actor preserves valid facts, DEL-05/verified invalidation authoritative and neutral community growth per Q20/Q38.
- REP-Q15 = A: retention thống kê gồm kỳ hiện tại + 52 tuần đã kết thúc gần nhất và 12 tháng lịch đã kết thúc gần nhất (theo Q04). Hết phạm vi không phục vụ lịch sử và phải có bounded cleanup; không giả 0 khi expired/unknown. Không cam kết có đủ các kỳ trước activation nếu không có nguồn chứng minh. Retention aggregate khác entitlement/ledger/fence/audit/checkpoint cần cho current rating, dedup/replay/rebuild; purge tối thiểu và DEL/privacy thắng retention. Không suy quyền giữ PII hoặc lịch sử thô vô hạn.
- REP-Q16 = B refined Q30/Q42: age-only 7*24h App principal, held maturity current-only, proof-backed event-time; source unchanged.
- REP-Q17 = A refined Q43: Top Rating valid-only, Top Growth positive and >=3 distinct net-positive actors; current authority before limit, Q29/Q44.
- REP-Q18 = A refined Q32/Q33: current proof-backed backfill; no fake preactivation history, first full period per calendar, baseline burned.
## Quyết định sản phẩm
- Q16=B, Q17=A, Q18=A đã ghi trong proposal r1 (lượt 6 ngày 27/11); tracker cũ chỉ đến Q15. Q30/Q42/Q43/Q33 dưới đây tinh chỉnh chúng.
- Q19=A: public Thấm đếm revision hiện hành; Impact dedup actor+WorkId qua anchor hợp lệ. Superseded bình thường khác hidden_revision_id/anchor vi phạm; không đổi nguồn LVE.
- Q20=A/A: DEL-05 actor deletion giảm current rating, không ghi âm community growth; closed aggregates chỉ giữ nếu privacy/deletion/correction cho phép. Q21=A: recipient deletion purge projection/index/cache cá nhân và loại mọi public statistics kể cả kỳ cũ; audit/fence hợp pháp tách riêng.
- Q22: top-k API trong scope, UI/design/Web/CMP ngoài scope. Q23: xóa nhận xét theo Q13, emoji không tính, comment edit/anchor revision hoãn đến COM-10/LVE-FR-04.
- Q24: synthetic/local only; không production/aggregate nếu không được cấp quyền riêng. Q25=60:40. Q26 normalized log (k=10, reference=100/component là candidate SR-01 để qualify). Q27 baseline 1000, scale 400, không trần nghiệp vụ, checked numeric bounds, half-up integer rating một lần; unavailable khác baseline. Q28 fixed-unit signed growth, G=2.4*dI+1.6*dC, exact tenths, versioned; không phải rating delta. Q29 Top 100, default page 20 max 100, canonical unrounded score desc, tie PrincipalId asc.
- Q30=A: App principals.created_at + 7*24h elapsed UTC, không Identity contract/network mới. Q31/Q37: source interactions trước tuổi vẫn hợp lệ tại nguồn; nếu OFF trước maturity thì first qualified ON thật sau threshold có thể credit; no-op/retry không phải ON mới. Q42 thay phần “không bao giờ tính” đối với held interactions. Q32=B: accepted receipt transitions theo committed_version/order và authority, không đếm receipt/no-op trực tiếp, không dùng updated_at/tuổi hiện tại thay proof; unknown excluded + coverage. Q33=A: backfill current valid facts; không dựng kỳ trước activation; first full week/month riêng lịch tại boundary >= activation readiness, held tại boundary baseline burned; partial period không giả complete/zero.
- Q34/Q38: authorized operator CLI, từng anchor/entitlement hoặc tập actor-recipient xác định tại watermark (không blanket ban tương lai); Reputation-only, source public counts unchanged. Evidence/reason/audit, dry-run/explicit apply, idempotency/invalidation fence, no resurrection. Recompute current + affected retained history từ toàn population eligible as-of, corrected revision/as_of, không community withdrawal giả; thiếu proof thì withhold. Không auto trừ do report, không admin UI/auto detection.
- Q35: #601 là S01, hoàn thiện SSOT, synthetic/precision/source qualification, CLI validate và exact owner signoff trước runtime; giữ 6 slice tuần tự. Chưa tạo issue con ở lượt này.
- Q36=A/Q41: xem state rule bên dưới; overrides phần xung đột Q07/Q12. Q39 public “Điểm Vink” (Reputation Rating), “Điểm tăng trưởng” (Growth Score); Impact/Contribution là thành phần Ảnh hưởng/Đóng góp nội bộ, không expose raw. Q40=A: minimized actor-recipient ledger + correction; no offline concentration dashboard V1.

## Q41 — invariant credit (chọn, sửa Q07/Q12/Q36)
Current selection/eligibility tách community credit; per entitlement có 2 state machines độc lập week/month:
UNSEEN(0) -> ACTIVE(1) khi first eligible effective community ON trong covered period (+1);
ACTIVE -> WITHDRAWN_PENDING(0, withdrawal period) khi voluntary effective OFF còn eligible (-1);
ON lại cùng withdrawal period -> ACTIVE (+1 bù, không fresh credit);
qua boundary vẫn OFF -> BURNED(0 terminal); ON/OFF sau burn = 0.
Baseline/preactivation hoặc held maturity -> BURNED, current-only. No-op/duplicate/retry/rollback/stale và mất một anchor khi còn anchor hợp lệ không sinh delta.
Net credit cuối - đầu kỳ = -1/0/+1 cho community transitions; lifetime net 0 hoặc 1 trước weight. Week/month độc lập, không cộng tuần suy tháng. Accepted event-time [start,end) Asia/Ho_Chi_Minh, đúng end thuộc kỳ mới; late/replay theo authoritative order và coverage.
Neutral lifecycle (privacy/withdrawn/hidden/delete/DEL-05/formula/maturity/backfill/correction) không giả ON/OFF: park credit khi tạm ineligible, restore không grant mới; OFF khi ineligible retire/burn không trừ; terminal invalidation/deletion retire không resurrect. End-start oracle áp community state, không lấy effective eligibility làm credit. Privacy/deletion/verified correction có thể remove/restate historical contributions separately, versioned; không giữ unsafe signal chỉ để bảo toàn growth.
Oracle: tuần 1 +1, tuần 2 -1, tuần 3 relike 0, tuần 4 unlike 0; nếu OFF/ON khác tuần cùng tháng thì month net 0. Model thêm same-period loops, multiple anchors, hidden/restore/retire, threshold/boundary race, late/retry/rollback, expiry.

## Q42 — maturity (chọn)
Durable bounded job một lần/actor, effective_at=created_at+7 ngày, recheck held eligible facts as-of threshold và lifecycle/order fences; current rating được ghi nhận, growth burned cả lịch. OFF trước threshold không maturity; first real eligible ON sau threshold nếu chưa được ghi nhận có thể credit theo Q37. Không dùng processing time; no-op/race/replay không mất/nhân/hồi sinh; không network Identity. Kỳ chuyển tiếp Q33 độc lập tuần/tháng.

## Q43 — Top Growth (chọn)
Net weighted growth >0 AND >=3 distinct eligible actors mỗi actor có net-positive weighted community credit cho recipient trong kỳ, sau privacy/correction. Nhiều entitlement cùng actor chỉ count 1; unlike-only, zero, neutral/maturity/backfill/burned không count. Không expose actor IDs/count. Ngưỡng 3 là heuristic chưa có thực nghiệm, không bảo đảm k-anonymity/anti-collusion; test differencing. Không thêm gate cho Top Rating.

## Q44 — snapshot (chọn có điều kiện correctness)
Open top-k immutable snapshot generation/as_of, target 5–10 phút đo thực tế (không SLA); profile PK projection gần realtime. Closed top100+50 reserve/table/period, không dense member history; retain minimized ledger/checkpoint đủ exact as-of reconstruction toàn eligible population (kể cả member không biến động). Reserve chỉ optimization, không guarantee: >50 excluded, restore/outsider/correction đổi ordering hoặc thiếu candidates -> offline refill/rebuild từ toàn population, không false-complete/stale/unsafe. Nếu thiếu evidence mark incomplete/unavailable. Current privacy/standing/deletion gate trước limit/cursor, invalidate/withhold unsafe snapshot/cache ngay; cursor bound snapshot/version/visibility generation, reject/restart stale. Closed ordinary later score không đổi as-of-end; authoritative late/correction có version. Q15 retain 52 closed weeks/12 closed months + open; source/fence/audit retention tách, minimize/purge.

Backend-only: PRD, Rust Domain/App, PostgreSQL, worker, read API, qualification. Design/Leptos Web/CMP tách epic. Không công khai runtime trước signoff và privacy/performance gate.
OPEN_TECHNICAL: numeric log constants/precision qualification, source evidence/event-time order, retention/minimization, transactional schema, correction/rebuild, cursor/freshness and rollout. Comment edit deferred. No exact signoff or activation; do not reopen product choices absent conflicting evidence.
"""
