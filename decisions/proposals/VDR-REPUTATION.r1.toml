version = 1
id = "VDR-REPUTATION"
revision = 1

[content]
kind = "product"
domain = "reputation"
title = "Điểm Vink V1 — hai thành phần, uy tín hiện hành, tăng trưởng theo kỳ và thống kê công khai"
resolution = """
Phạm vi nghiệp vụ Epic #600 sau review 27–28/11/2026 (REP-Q01..Q44). Q41..Q44 thay phần xung đột
của Q07, Q12, Q16..Q18 và Q36. Backend only; Design, Leptos Web và CMP thuộc epic khác.

Tên và thành phần
- Q01 = A, Q39: công khai một điểm tổng “Điểm Vink” (Reputation Rating) và “Điểm tăng trưởng”
  (Growth Score). Hai thành phần nội bộ: Ảnh hưởng (Impact) từ Thấm nhận được trên tác phẩm và Đóng
  góp (Contribution) từ Ưng nhận được trên nhận xét. Không tính Follow, lượt xem, lượt lưu, số bài
  hay số nhận xét. Không phải Elo đối đầu; không trả thành phần thô.
- Q02 = A, Q19 = A: Impact ghi nhận tối đa một đơn vị cho mỗi (người Thấm, WorkId) qua các revision
  còn là anchor hợp lệ. Revision bị thay thế bình thường vẫn là anchor; revision bị ẩn
  (hidden_revision_id) hoặc anchor vi phạm thì không. Số Thấm công khai của nguồn vẫn đếm revision
  hiện hành; Reputation không đổi semantics LVE.
- Q23: Contribution ghi nhận mỗi (người Ưng, CommentId). Xóa nhận xét theo Q13; emoji không tính;
  sửa nhận xét và anchor revision của nhận xét hoãn tới COM-10/LVE-FR-04.

Công thức
- Q25 = 60:40, Q26 normalized log, Q27: R = 1000 + 400 × (0,6 × f(I) + 0,4 × f(C)) với
  f(x) = ln(1 + x/10) / ln(1 + 100/10); k = 10 và reference = 100 cho mỗi thành phần
  (formula_version 1). Không trần nghiệp vụ; kiểm biên số học. Xếp hạng theo điểm canonical chưa
  làm tròn; hiển thị làm tròn half-up thành số nguyên đúng một lần. Thành viên chưa có ghi nhận hợp
  lệ nhận đúng 1000; trạng thái unavailable/disabled khác 1000.
- Q28: Điểm tăng trưởng là đơn vị cố định có dấu G = 2,4 × dI + 1,6 × dC, chính xác tới 0,1, có
  version; không phải hiệu số rating.
- Q29: Top 100 mỗi bảng; trang mặc định 20, tối đa 100; điểm canonical giảm dần, hòa thì PrincipalId
  tăng dần.
- Q24: hiệu chỉnh chỉ dùng dữ liệu tổng hợp/local; không đọc production hay số liệu tổng hợp thật
  khi chưa có quyền riêng.

Hiện hành và vòng đời
- Q03 = B: điểm theo eligibility hiện hành; không decay ở V1.
- Q13 = A: chuyển riêng tư, rút về, tác giả xóa hoặc admin gỡ nội dung đổi điểm hiện hành, không ghi
  âm tăng trưởng cộng đồng; khôi phục không tạo tăng trưởng.
- Q14 = A: đình chỉ actor không thu hồi Thấm/Ưng hợp lệ đã có; quyền nguồn vẫn chặn ghi mới.
- Q20 = A/A: xóa tài khoản actor theo DEL-05 giảm điểm hiện hành của người nhận, không ghi âm tăng
  trưởng; kỳ đã đóng giữ tổng chỉ khi privacy/deletion/correction cho phép.
- Q21 = A: xóa tài khoản người nhận purge projection/index/cache cá nhân và loại khỏi mọi thống kê
  công khai kể cả kỳ cũ; audit và fence hợp pháp tách riêng.
- Q08 = A: đình chỉ toàn bộ người nhận ẩn điểm và loại khỏi mọi thống kê công khai kể cả kỳ cũ trong
  thời gian đình chỉ; giữ facts hợp lệ, phục hồi không reset và không tạo tăng trưởng.
- Q11 = A: người chỉ nhận Ưng vẫn có điểm và vào thống kê khi đủ điều kiện.

Eligibility, trưởng thành và backfill
- Q16 = B, Q30 = A: chỉ ghi nhận tương tác của actor có tuổi principal ≥ 7 × 24 giờ tính từ App
  principals.created_at (UTC); không thêm contract hay lời gọi mạng tới Identity. Tương tác trước
  ngưỡng vẫn hợp lệ ở nguồn.
- Q42, Q31, Q37: tại created_at + 7 ngày, một job bền chạy một lần cho mỗi actor, ghi các tương tác
  đang ON và còn hợp lệ vào điểm hiện hành (current-only; tăng trưởng của chúng burned ở cả tuần và
  tháng). Tương tác đã OFF trước ngưỡng không được ghi; ON thật đầu tiên sau ngưỡng của entitlement
  chưa từng được ghi nhận có thể tạo tăng trưởng. No-op/retry không phải ON mới; không dùng thời
  điểm xử lý.
- Q32 = B: chỉ chuyển trạng thái accepted có bằng chứng thứ tự và thời điểm (committed_version/order
  và authority) mới vào lịch sử; không đếm receipt/no-op trực tiếp, không thay bằng updated_at hay
  tuổi hiện tại. Không chứng minh được thì loại và ghi coverage.
- Q18 = A, Q33 = A: backfill facts hợp lệ hiện hành vào điểm hiện hành; không dựng kỳ trước
  activation. Kỳ tuần và kỳ tháng đầy đủ đầu tiên bắt đầu tại boundary riêng của mỗi lịch, không sớm
  hơn lúc activation sẵn sàng; credit đang có tại boundary là baseline burned. Kỳ một phần không giả
  đầy đủ hay bằng 0.

Tăng trưởng theo kỳ
- Q04 = A: tuần thứ Hai–Chủ nhật và tháng lịch theo Asia/Ho_Chi_Minh, khoảng [start, end); sự kiện
  đúng end thuộc kỳ mới. Tuần và tháng độc lập, không cộng tuần ra tháng.
- Q05 = B, Q07, Q12, Q36 = A, Q41: mỗi entitlement có hai máy trạng thái credit độc lập (tuần, tháng):
  UNSEEN(0) → ACTIVE(1) với ON cộng đồng đủ điều kiện đầu tiên (+1);
  ACTIVE → WITHDRAWN_PENDING(0) khi OFF tự nguyện lúc còn eligible (−1);
  ON lại trong cùng kỳ rút → ACTIVE (+1 bù, không phải credit mới);
  qua boundary vẫn OFF → BURNED(0, terminal); ON/OFF sau BURNED = 0.
  Baseline/trước activation và held maturity vào thẳng BURNED (current-only).
  Net credit mỗi kỳ ∈ {−1, 0, +1}; net trọn đời ∈ {0, 1} trước trọng số.
- Sự kiện trung tính (riêng tư, rút về, ẩn, xóa, DEL-05, đổi công thức, maturity, backfill,
  correction) không giả ON/OFF: ineligible tạm thời thì park credit, khôi phục không cấp mới; OFF khi
  đang ineligible thì retire/burn không trừ; invalidation hoặc xóa terminal thì retire, không hồi
  sinh. Privacy/deletion/correction đã xác minh có thể sửa lịch sử riêng và có version; không giữ tín
  hiệu không an toàn chỉ để bảo toàn tăng trưởng.
- Oracle: Thấm tuần 1 +1, bỏ tuần 2 −1, Thấm lại tuần 3 0, bỏ tuần 4 0; OFF và ON ở hai tuần khác
  nhau của cùng tháng cho tháng net 0.
- No-op, duplicate, retry, rollback, lệnh cũ và mất một anchor khi còn anchor hợp lệ không sinh
  delta. Sự kiện đến muộn hoặc replay theo thứ tự của authority và coverage.

Thống kê và snapshot
- Q06 = A: điểm tổng và thống kê công khai cả với khách, chỉ cho hồ sơ đủ điều kiện; không mở quyền,
  không ảnh hưởng ranking tác phẩm.
- Q09 = A, Q10 = A: kỳ mở dùng snapshot hiện hành (as_of); kỳ đóng dùng điểm as-of end boundary,
  không lấy đỉnh hay điểm hiện tại.
- Q17 = A, Q43: Top Rating chỉ gồm người có ghi nhận hợp lệ (không chỉ baseline). Top Growth cần
  G > 0 và ≥ 3 actor đủ điều kiện khác nhau, mỗi actor có net credit có trọng số dương cho người
  nhận trong kỳ, sau privacy/correction. Nhiều entitlement của cùng actor tính một; không trả số actor
  hay danh tính. Ngưỡng 3 là heuristic, không bảo đảm k-anonymity hay chống thông đồng. Top Rating
  không có thêm gate này.
- Q22: API top-k trong phạm vi; UI và design ngoài phạm vi.
- Q44: snapshot top-k kỳ mở bất biến theo generation/as_of, mục tiêu 5–10 phút đo thực tế (không
  SLA); điểm hồ sơ đọc projection theo khóa chính, gần realtime. Kỳ đóng lưu top 100 + 50 dự phòng
  mỗi bảng, không lưu lịch sử dày từng thành viên; giữ ledger/checkpoint tối thiểu đủ dựng lại
  chính xác as-of toàn bộ quần thể đủ điều kiện, kể cả thành viên không biến động. Hết dự phòng,
  người ngoài được khôi phục hoặc correction đổi thứ tự thì dựng lại offline từ toàn quần thể;
  thiếu bằng chứng thì đánh dấu incomplete/unavailable. Gate privacy/standing/deletion hiện hành
  chạy trước limit/cursor; cursor gắn snapshot/version/visibility generation, cũ thì từ chối.
- Q15 = A: giữ kỳ mở + 52 tuần + 12 tháng lịch đã đóng gần nhất; expiry theo boundary, cleanup
  bounded, không giả 0 khi hết hạn hoặc không rõ. Retention nguồn/ledger/fence/audit tách riêng và
  tối thiểu; privacy/deletion thắng retention.

Correction và anti-abuse
- Q34, Q38: chỉ operator CLI có thẩm quyền, theo từng anchor/entitlement hoặc tập actor–người nhận
  xác định tại watermark (không cấm trước tương tác tương lai); chỉ tác động Reputation, số công
  khai của nguồn giữ nguyên. Có bằng chứng, lý do, audit, dry-run rồi apply rõ ràng, idempotent, fence
  invalidation và không hồi sinh. Tính lại điểm hiện hành và các kỳ còn giữ bị ảnh hưởng từ toàn quần
  thể as-of, có correction revision; thiếu bằng chứng thì withhold. Không tự trừ vì report, không UI
  admin, không tự phát hiện.
- Q40 = A: ledger actor–người nhận tối thiểu + correction; không dashboard tập trung offline ở V1.

Quy trình
- Q35: #601 là REP-S01; sáu lát tuần tự S01..S06. Không công khai runtime trước signoff đúng
  revision và gate privacy/performance.
"""
rationale = """
