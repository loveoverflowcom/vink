title = "Editor R4: mặt viết liền mạch và xem trước trong Markdown"
resolution = """
Trên /ban-viet/{id}, bỏ nút xem trước độc lập và hộp thoại render lại chữ đang viết. Không đưa hành động này vào Chi tiết lưu, không thay bằng Đọc thử hoặc một chế độ viết thứ hai. Giữ Markdown Live Preview trong một EditorView, xem trước và xác nhận khi đổi định dạng, Reader, và render snapshot đã gửi cho nhân sự kiểm duyệt. Nháp vẫn riêng tư, không tính lượt xem. Lưu nháp và gửi duyệt là hai hành động riêng.
Ở giao diện sáng và tối, tiêu đề Mặc định và nội dung cả hai định dạng dùng caret và dấu focus ngắn ở lề giấy. Nhãn tiêu đề có vị trí cố định. Phím Tab, lỗi nhập và chỉ báo hệ thống ở chế độ tương phản cao vẫn nhận biết được.
"""
rationale = """
Ngày 24/11/2026, chủ sản phẩm hỏi “Tại sao cần cái tính năng xem trước bản nháp nhỉ ?” rồi yêu cầu “Để cập nhật ssot và sửa lại, clean code cũ”. Delta trong issue #475 (https://github.com/loveoverflowcom/vink/issues/475) thay thế nút con mắt trong bàn giao R4 ngày 23/11 của #428. Giữ quy tắc Giao diện chỉ tại /toi theo VDR-WEB-APPEARANCE@r1; đề xuất này không thay revision đó. Issue #526 (https://github.com/loveoverflowcom/vink/issues/526) ghi phản hồi về viền focus đậm trên mặt viết. Vạch ngắn và nhãn cố định là lựa chọn triển khai trong phạm vi đó. Ảnh concept chưa được duyệt làm mốc thị giác.
"""
