[content]
kind = "architecture"
domain = "account"
title = "D-05 §11 C1 gửi thư xác thực bằng Resend HTTPS API"
resolution = """
Dùng Resend HTTPS REST API cho email xác thực, không triển khai SMTP mới
và không dùng SMTP làm đường gửi production. Giữ outbox PostgreSQL,
worker Identity qua MailSender và local-outbox cho dev/test.
"""
rationale = """
Giữ việc gửi ngoài request và dùng Idempotency-Key ổn định trong phạm vi
bảo đảm của nhà cung cấp; API key chỉ có quyền gửi, đọc từ file secret.
Chọn transport không chấp nhận D-05 hay phê duyệt bật đăng nhập.
"""
requires = ["D-05@r1"]
related_ids = ["D-05-C2"]
