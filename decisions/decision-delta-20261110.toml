[[records]]
id = "PRODUCT-DECISIONS-20261110-CHOICE-01"
revision = 1

[records.content]
kind = "architecture"
domain = "discussion"
title = "Bản sửa bình luận đang chờ duyệt"
resolution = "**A** — giữ bản công khai đã duyệt; bản sửa là candidate riêng. “Đã sửa” gắn bản đang hiển thị"
rationale = "A giữ mạch thảo luận nhưng người viết thấy chữ cũ lâu hơn nếu evaluator chậm; bản cũ có thể bị admin gỡ trong lúc chờ (model có nhánh này: không còn gì công khai cho tới khi candidate được duyệt)"

[records.legacy]
status = "DESIGN_PROPOSED"
historical = false
source_line = 62
related_ids = ["COM-10"]

[records.legacy.context]
alternative = "B — tạm ẩn nội dung trong lúc duyệt sửa"
review_when = "Policy yêu cầu rút bản cũ ngay khi người viết sửa; hoặc đo thấy thời gian chờ làm người đọc trả lời nhầm bản cũ"

[[records]]
id = "PRODUCT-DECISIONS-20261110-CHOICE-02"
revision = 1

[records.content]
kind = "architecture"
domain = "discovery"
title = "Điểm đề xuất"
resolution = "**A** — `recommend.v1`: `score = H × ⌊log2(1 + votes)⌋ − tuổi`; thứ tự tương đương khóa `first_published_at + H × ⌊log2(1 + votes)⌋`"
rationale = "A: một tham số `H`, thứ tự không phụ thuộc đồng hồ (cursor không trôi theo thời gian), không có “vách” cửa sổ; đổi lại bậc thang theo lũy thừa 2. B dễ giải thích theo phần trăm nhưng cần hai trọng số + cửa sổ + trần vote, và thứ tự đổi khi bài rơi khỏi cửa sổ"

[records.legacy]
status = "DESIGN_PROPOSED"
historical = false
source_line = 63
related_ids = [
    "RANK-01",
    "RANK-04",
]

[records.legacy.context]
alternative = "B — tổng vote và độ mới đã chuẩn hóa trong một cửa sổ"
review_when = "Có dữ liệu thật để tuning; chủ sản phẩm muốn bài cũ nhiều vote không bao giờ vượt bài mới"

[[records]]
id = "PRODUCT-DECISIONS-20261110-CHOICE-03"
revision = 1

[records.content]
kind = "architecture"
domain = "discovery"
title = "Phân trang Top 100"
resolution = "**A** — snapshot hữu hạn ≤ 100 ứng viên chụp ở trang đầu, mang trong cursor; mỗi lần đọc kiểm lại quyền hiện hành; hết hạn → tín hiệu làm mới"
rationale = "A không lặp/thiếu trong snapshot dù vote đổi, không cần bảng snapshot hay Redis (100 ID ≈ 2 KB); đổi lại cursor lớn và bài mới đủ điều kiện chỉ thấy sau khi làm mới. B buộc bắt đầu lại gần như mọi lần vì vote đổi liên tục"

[records.legacy]
status = "DESIGN_PROPOSED"
