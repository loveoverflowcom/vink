[[records]]
id = "ADM-01"
revision = 1

[records.content]
kind = "product"
domain = "moderation"
title = "Admin tổng và moderator"
resolution = "Admin tổng quản lý quyền, phản đối cuối cùng và chế độ tự động. Grant duyệt tác phẩm và grant duyệt bình luận độc lập; cá nhân hoặc nhóm do admin quản lý; toàn Vink hoặc một `WorkId`; có hạn. Grant bình luận hiện hành được kế thừa. Kiểm lại quyền, tư cách tài khoản, thành viên nhóm ở mỗi lần đọc/xử lý; tự né nội dung của mình và bình luận trên bài của mình"

[records.legacy]
group = "ADMIN-MODERATION-20261111"
status = "PRODUCT_CONFIRMED"
historical = false
source_line = 172
related_ids = [
    "MOD-09",
    "MOD-11",
]

[records.legacy.context]
canonical_references = "MOD-09, MOD-11"
previous_rule = "Một vai trò admin; grant moderator chỉ cho bình luận"
model = "`governance.qnt`"
core = "`domain::moderation::authority`"

