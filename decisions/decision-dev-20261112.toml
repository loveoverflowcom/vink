title = "READ-01 CHOICE-02 chính sách Cache-Control cho đọc công khai"
resolution = """
Trình duyệt được lưu nhưng phải hỏi lại server trước mỗi lần dùng; không shared cache (chưa có CDN và nội dung rút bài không được nằm ở cache trung gian). Không đặt TTL, nên không có hai TTL chồng nhau với READ-02.
`404`/`503`/`500` không bị lưu, nên không giữ một 404 qua lúc phục hồi.
Không header nào chọn representation (không nén, không locale/filter)."""
rationale = "chưa có CDN và nội dung rút bài không được nằm ở cache trung gian"
