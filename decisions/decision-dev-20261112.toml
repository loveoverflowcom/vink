id = "D-05-C5"
revision = 1

[records.content]
kind = "architecture"
domain = "account"
title = "D-05 §11 C5 retention, dọn dẹp định kỳ và phục hồi dữ liệu tạm auth"
resolution = """
Challenge (kèm thư) xóa 7 ngày sau hết hạn; phiên 30 ngày sau khi đóng; bộ đếm 1 ngày sau cửa sổ.
Prune chạy mỗi giờ (Identity `serve`, `vink-worker`) và bằng lệnh vận hành; idempotent, an toàn khi nhiều tiến trình.
Phục hồi: lease hết hạn → thư được gửi lại; relay phục hồi → backoff gửi tiếp."""
rationale = "chỉ mất dữ liệu tạm (thư chờ, bộ đếm), không mất tài khoản, phiên hay principal."
requires = ["D-05@r1"]

